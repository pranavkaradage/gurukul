# Development Configuration with H2 In-Memory Database
# Use this if MySQL is not configured yet

server.port=8080
server.servlet.context-path=/

# H2 In-Memory Database Configuration (No MySQL required)
spring.datasource.url=jdbc:h2:mem:mydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging - accessible at https://gurukulschools.org/api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# File Storage Path
file.upload.dir=uploads/

# JWT Configuration
jwt.secret=GurukulSecretKeyForJWTTokenGeneration2024SecureAndLongEnoughForHS512Algorithm
jwt.expiration=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,https://gurukulschools.org,https://www.gurukulschools.org

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

